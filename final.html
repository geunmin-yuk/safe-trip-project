<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안심여행 스텝</title>
    
    <!-- 디자인 마법 (Tailwind CSS) 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 카카오맵 API 불러오기 (가장 중요!) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cb042192382ed6a341ff3f2649753c8f&libraries=services"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 max-w-6xl">
        <!-- 1. 검색창 영역 -->
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <h1 class="text-2xl font-bold text-green-600 mb-2">안심여행 스텝 🗺️</h1>
            <p class="text-gray-600 mb-4">어디로 떠나시나요? 여행지의 안전 점수를 확인해보세요!</p>
            <div class="flex">
                <input id="search-input" type="text" placeholder="예: 설악산, 해운대, 제주도, 경주" class="flex-grow p-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                <button id="search-button" class="bg-green-600 text-white font-bold p-2 rounded-r-lg hover:bg-green-700 w-24 flex items-center justify-center">
                    <span id="search-text">검색</span>
                    <svg id="loading-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 2. 지도와 정보창 영역 -->
        <!-- [수정된 부분!] HTML 순서를 바꾸고 flex-col-reverse를 유지하여 원하는 반응형 레이아웃을 구현합니다. -->
        <div class="flex flex-col-reverse md:flex-row gap-4">
            <!-- 지도 (HTML 순서를 정보창보다 위로 옮겼습니다) -->
            <div id="map" class="w-full md:w-2/3 bg-white rounded-lg shadow-md" style="height:500px;">
                <!-- 이 공간은 스크립트에 의해 지도로 채워집니다. -->
            </div>

            <!-- 정보창 -->
            <div id="info-window" class="w-full md:w-1/3 bg-white p-4 rounded-lg shadow-md flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-center">안전 정보</h2>
                <div class="text-center p-4 flex-grow flex flex-col justify-center">
                    <div id="score-circle" class="mx-auto w-32 h-32 rounded-full flex items-center justify-center text-4xl font-bold bg-gray-200 text-gray-500 transition-all duration-500">
                        ?
                    </div>
                    <p id="score-text" class="mt-2 font-semibold text-gray-600">장소를 검색해주세요</p>
                </div>
                <div id="info-details" class="mt-4">
                    <!-- 검색 결과가 여기에 표시됩니다. -->
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 우리 웹사이트의 뇌 (JavaScript) -->
    <script>
        kakao.maps.load(() => {
            // 지도 초기화 (setTimeout은 안정적인 로딩을 위해 유지)
            setTimeout(() => {
                const mapContainer = document.getElementById('map'); 
                const mapOption = { 
                    center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울 중심
                    level: 7
                };
                const map = new kakao.maps.Map(mapContainer, mapOption); 
                
                // 마커와 원을 관리할 변수
                let markers = [];
                let circle = null;

                // HTML 요소 가져오기
                const searchInput = document.getElementById('search-input');
                const searchButton = document.getElementById('search-button');
                const scoreCircle = document.getElementById('score-circle');
                const scoreText = document.getElementById('score-text');
                const infoDetails = document.getElementById('info-details');
                const loadingSpinner = document.getElementById('loading-spinner');
                const searchText = document.getElementById('search-text');

                // 검색 실행 함수 (백엔드 연동 버전)
                async function executeSearch() {
                    const query = searchInput.value;
                    if (!query) {
                        alert("검색어를 입력해주세요.");
                        return;
                    }

                    // --- 1. 로딩 시작 ---
                    searchText.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                    searchButton.disabled = true;

                    try {
                        // --- 2. 우리 백엔드 서버에 점수 요청! ---
                        const response = await fetch(`http://127.0.0.1:5000/api/score?query=${encodeURIComponent(query)}`);
                        
                        if (!response.ok) {
                            throw new Error('서버에서 응답을 받지 못했습니다.');
                        }
                        
                        const result = await response.json();

                        if (result.error) {
                            alert(`오류: ${result.error}`);
                        } else {
                            // --- 3. 성공! 서버에서 받은 진짜 데이터로 화면 업데이트 ---
                            const moveLatLng = new kakao.maps.LatLng(result.location_lat, result.location_lon);
                            map.setCenter(moveLatLng);
                            map.relayout();

                            scoreCircle.textContent = result.safety_score;
                            scoreText.textContent = `${result.searched_location}의 안전 점수`;
                            
                            let scoreColorClasses = "";
                            if (result.safety_score >= 80) scoreColorClasses = "bg-green-100 text-green-600";
                            else if (result.safety_score >= 50) scoreColorClasses = "bg-yellow-100 text-yellow-600";
                            else scoreColorClasses = "bg-red-100 text-red-600";
                            scoreCircle.className = `mx-auto w-32 h-32 rounded-full flex items-center justify-center text-4xl font-bold transition-all duration-500 ${scoreColorClasses}`;
                            
                            markers.forEach(marker => marker.setMap(null));
                            markers = [];
                            if (circle) circle.setMap(null);

                            let travelTimeText = result.travel_time_seconds > 0 ? 
                                `${Math.floor(result.travel_time_seconds / 60)}분 ${result.travel_time_seconds % 60}초` : '정보 없음';
                            
                            let detailsHtml = '<h3 class="font-bold border-t pt-4 mt-4">주요 안심 정보</h3><ul class="list-disc pl-5 mt-2 text-gray-700 space-y-1">';
                            detailsHtml += `<li>🚑 가장 가까운 응급실: ${travelTimeText} 소요 (가정)</li>`;
                            detailsHtml += `<li>❤️ 주변 AED 개수: ${result.nearby_aeds_total}개</li>`;
                            detailsHtml += '</ul>';
                            infoDetails.innerHTML = detailsHtml;
                        }
                    } catch (error) {
                        console.error('Fetch Error:', error);
                        alert("데이터를 불러오는 데 실패했습니다. 백엔드 서버가 켜져있는지 확인해주세요.");
                    } finally {
                        // --- 4. 로딩 종료 ---
                        searchText.classList.remove('hidden');
                        loadingSpinner.classList.add('hidden');
                        searchButton.disabled = false;
                    }
                }

                // 이벤트 리스너 연결
                searchButton.addEventListener('click', executeSearch);
                searchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') executeSearch();
                });

            }, 100);
        });
    </script>
</body>
</html>
