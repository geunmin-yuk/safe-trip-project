<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안심여행 스텝</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cb042192382ed6a341ff3f2649753c8f&libraries=services"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 max-w-6xl">
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <h1 class="text-2xl font-bold text-green-600 mb-2">안심여행 스텝 🗺️</h1>
            <p class="text-gray-600 mb-4">어디로 떠나시나요? 여행지의 안전 점수를 확인해보세요!</p>
            <div class="flex">
                <input id="search-input" type="text" placeholder="예: 경복궁, 해운대, 충남대학교" class="flex-grow p-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                <button id="search-button" class="bg-green-600 text-white font-bold p-2 rounded-r-lg hover:bg-green-700 w-24 flex items-center justify-center">
                    <span id="search-text">검색</span>
                    <svg id="loading-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="flex flex-col-reverse md:flex-row gap-4">
            <div id="map" class="w-full md:w-2/3 bg-white rounded-lg shadow-md" style="height:500px;">
                </div>

            <div id="info-window" class="w-full md:w-1/3 bg-white p-4 rounded-lg shadow-md flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-center">안전 정보</h2>
                <div class="text-center p-4 flex-grow flex flex-col justify-center">
                    <div id="score-circle" class="mx-auto w-32 h-32 rounded-full flex items-center justify-center text-4xl font-bold bg-gray-200 text-gray-500 transition-all duration-500">
                        ?
                    </div>
                    <p id="score-text" class="mt-2 font-semibold text-gray-600">장소를 검색해주세요</p>
                </div>
                <div id="info-details" class="mt-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        kakao.maps.load(() => {
            setTimeout(() => {
                const mapContainer = document.getElementById('map'); 
                const mapOption = { 
                    center: new kakao.maps.LatLng(37.566826, 126.9786567),
                    level: 7
                };
                const map = new kakao.maps.Map(mapContainer, mapOption); 
                
                // --- Phase 2: 마커 관리를 위한 배열 및 아이콘 설정 ---
                let currentMarkers = []; // 지도에 표시된 모든 마커를 관리하는 배열
                
                const icons = {
                    aed: new kakao.maps.MarkerImage(
                        'https://emojigraph.org/media/twitter/red-heart_2764-fe0f.png',
                        new kakao.maps.Size(30, 30),
                        { offset: new kakao.maps.Point(15, 15) }
                    ),
                    er: new kakao.maps.MarkerImage(
                        'https://emojigraph.org/media/twitter/ambulance_1f691.png',
                        new kakao.maps.Size(35, 35),
                        { offset: new kakao.maps.Point(17, 17) }
                    ),
                    location: new kakao.maps.MarkerImage(
                        'https://emojigraph.org/media/twitter/round-pushpin_1f4cd.png',
                        new kakao.maps.Size(35, 35),
                        { offset: new kakao.maps.Point(17, 35) }
                    )
                };

                // HTML 요소 가져오기
                const searchInput = document.getElementById('search-input');
                const searchButton = document.getElementById('search-button');
                const scoreCircle = document.getElementById('score-circle');
                const scoreText = document.getElementById('score-text');
                const infoDetails = document.getElementById('info-details');
                const loadingSpinner = document.getElementById('loading-spinner');
                const searchText = document.getElementById('search-text');

                // --- Phase 2: 모든 마커를 지도에서 제거하는 함수 ---
                function clearMarkers() {
                    for (let i = 0; i < currentMarkers.length; i++) {
                        currentMarkers[i].setMap(null);
                    }
                    currentMarkers = [];
                }

                // --- Phase 2: 마커와 인포윈도우를 생성하고 지도에 표시하는 함수 ---
                function displayMarkers(places, type) {
                    if (!places || places.length === 0) return;

                    const image = icons[type];
                    const bounds = new kakao.maps.LatLngBounds(); // 지도 범위를 재설정할 객체

                    places.forEach(place => {
                        const position = new kakao.maps.LatLng(place.lat, place.lon);
                        
                        const marker = new kakao.maps.Marker({
                            map: map,
                            position: position,
                            image: image
                        });

                        const infowindow = new kakao.maps.InfoWindow({
                            content: `<div style="padding:5px;font-size:12px;">${place.name}</div>`,
                            removable: true
                        });

                        kakao.maps.event.addListener(marker, 'click', function() {
                            infowindow.open(map, marker);
                        });
                        
                        currentMarkers.push(marker); // 생성된 마커를 배열에 추가
                        bounds.extend(position); // 지도 범위에 현재 마커 위치 추가
                    });

                    return bounds;
                }


                // --- 특정 장소의 안전 점수를 가져오는 함수 (Phase 2 적용) ---
                async function getScoreForSpot(spotName) {
                    searchText.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                    searchButton.disabled = true;

                    try {
                        const response = await fetch(`http://127.0.0.1:5000/api/score?query=${encodeURIComponent(spotName)}`);
                        if (!response.ok) throw new Error('서버 응답 실패');
                        
                        const result = await response.json();
                        if (result.error) {
                            alert(`오류: ${result.error}`);
                            infoDetails.innerHTML = ''; 
                        } else {
                            // 1. 화면 업데이트 (점수, 텍스트 등)
                            scoreCircle.textContent = result.safety_score;
                            scoreText.textContent = `${result.searched_location}의 안전 점수`;
                            
                            let scoreColorClasses = "";
                            if (result.safety_score >= 80) scoreColorClasses = "bg-green-100 text-green-600";
                            else if (result.safety_score >= 50) scoreColorClasses = "bg-yellow-100 text-yellow-600";
                            else scoreColorClasses = "bg-red-100 text-red-600";
                            scoreCircle.className = `mx-auto w-32 h-32 rounded-full flex items-center justify-center text-4xl font-bold transition-all duration-500 ${scoreColorClasses}`;
                            
                            let travelTimeText = result.travel_time_seconds > 0 ? 
                                `${Math.floor(result.travel_time_seconds / 60)}분 ${result.travel_time_seconds % 60}초` : '정보 없음';
                            
                            let detailsHtml = '<h3 class="font-bold border-t pt-4 mt-4">주요 안심 정보</h3><ul class="list-disc pl-5 mt-2 text-gray-700 space-y-1">';
                            detailsHtml += `<li>🚑 가장 가까운 응급실: ${travelTimeText} (${result.nearest_er})</li>`;
                            detailsHtml += `<li>❤️ 주변 AED 개수: ${result.nearby_aeds_total}개</li>`;
                            detailsHtml += '</ul>';
                            infoDetails.innerHTML = detailsHtml;

                            // --- 2. Phase 2: 지도 시각화 로직 ---
                            clearMarkers(); // 기존 마커 모두 제거

                            const bounds = new kakao.maps.LatLngBounds(); // 지도 범위 객체 생성

                            // 검색된 위치 마커 표시
                            const locationPosition = new kakao.maps.LatLng(result.location_lat, result.location_lon);
                            const locationMarker = new kakao.maps.Marker({
                                map: map,
                                position: locationPosition,
                                image: icons.location
                            });
                            currentMarkers.push(locationMarker);
                            bounds.extend(locationPosition); // 지도 범위에 검색 위치 추가

                            // 주변 AED 마커 표시 (name, lat, lon 키를 가진 객체 배열이라고 가정)
                            if (result.aeds && result.aeds.length > 0) {
                                displayMarkers(result.aeds, 'aed');
                                result.aeds.forEach(aed => bounds.extend(new kakao.maps.LatLng(aed.lat, aed.lon)));
                            }

                            // 주변 병원 마커 표시 (name, lat, lon 키를 가진 객체 배열이라고 가정)
                            if (result.ers && result.ers.length > 0) {
                                displayMarkers(result.ers, 'er');
                                result.ers.forEach(er => bounds.extend(new kakao.maps.LatLng(er.lat, er.lon)));
                            }
                            
                            // 모든 마커가 보이도록 지도 범위 설정
                            map.setBounds(bounds);
                            map.relayout();
                        }
                    } catch (error) {
                        console.error('Fetch Error:', error);
                        alert("데이터를 불러오는 데 실패했습니다. 백엔드 서버가 켜져있는지 확인해주세요.");
                    } finally {
                        searchText.classList.remove('hidden');
                        loadingSpinner.classList.add('hidden');
                        searchButton.disabled = false;
                    }
                }

                // --- 메인 검색 함수 (이제 인기 관광지를 먼저 찾습니다) ---
                async function executeSearch() {
                    const query = searchInput.value;
                    if (!query) {
                        alert("검색어를 입력해주세요.");
                        return;
                    }
                    searchText.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                    searchButton.disabled = true;

                    try {
                        const spotsResponse = await fetch(`http://127.0.0.1:5000/api/popular-spots?query=${encodeURIComponent(query)}`);
                        const spots = await spotsResponse.json();

                        if (spots.length > 0) {
                            let spotsHtml = '<h3 class="font-bold border-t pt-4 mt-4">이런 장소는 어떠세요?</h3><div class="flex flex-col space-y-2 mt-2">';
                            spots.forEach(spot => {
                                spotsHtml += `<button class="spot-button w-full text-left p-2 bg-gray-100 rounded hover:bg-green-100" data-spot-name="${spot.title}">${spot.title}</button>`;
                            });
                            spotsHtml += '</div>';
                            infoDetails.innerHTML = spotsHtml;
                            
                            document.querySelectorAll('.spot-button').forEach(button => {
                                button.addEventListener('click', (event) => {
                                    const spotName = event.target.getAttribute('data-spot-name');
                                    getScoreForSpot(spotName); 
                                });
                            });
                            
                            searchText.classList.remove('hidden');
                            loadingSpinner.classList.add('hidden');
                            searchButton.disabled = false;

                        } else {
                            getScoreForSpot(query);
                        }
                    } catch (error) {
                        console.error('Popular spots fetch error:', error);
                        alert("인기 관광지 정보를 불러오는 데 실패했습니다. 직접 장소명을 입력해보세요.");
                        
                        searchText.classList.remove('hidden');
                        loadingSpinner.classList.add('hidden');
                        searchButton.disabled = false;
                    }
                }

                searchButton.addEventListener('click', executeSearch);
                searchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') executeSearch();
                });

            }, 100);
        });
    </script>
</body>
</html>
